<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>eShop Top Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
<style>
:root{--bg:#F8F6F1;--surface:#FFFFFF;--ink:#1F1D1A;--muted:#6E6A62;--line:#E7E2D8;--accent:#2B48D6;--accent-ink:#FFFFFF;--bar-l:52%;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#root{max-width:960px;margin:0 auto;padding:18px 16px 48px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:1rem;font-weight:600;margin:0;color:var(--muted)}
h2{font-size:1.35rem;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 14px;font-size:.95rem}
section{margin-top:44px}

/* Hero: the day's top game */
.hero{margin-top:26px;text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.hero-label{color:var(--muted);font-size:.95rem;margin:0 0 14px}
.hero-art{display:block;width:min(100%,540px);margin:0 auto;border-radius:22px;box-shadow:0 18px 50px rgba(31,29,26,.18),0 2px 6px rgba(31,29,26,.08);background:var(--surface);overflow:hidden}
.hero-art img{display:block;width:100%;height:auto}
.hero-game{font-size:clamp(1.8rem,6vw,3rem);font-weight:800;line-height:1.05;letter-spacing:-.025em;margin:22px auto 8px;max-width:640px;overflow-wrap:anywhere}
.hero-meta{color:var(--muted);font-size:1rem;margin:0}
.pips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:14px auto 0;max-width:540px}
.pip{width:14px;height:14px;border-radius:4px}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero{animation:none}}

/* Placeholder when a game has no image yet */
.ph{display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:#fff;font-weight:800;text-align:center;padding:8%;line-height:1.1}
.hero-art .ph{aspect-ratio:1;font-size:clamp(1.6rem,6vw,2.6rem)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:.9rem;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg.spaced{margin-bottom:12px}

/* Calendar: one picture per day */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head strong{font-size:1.1rem}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:40px;height:40px;font:inherit;font-size:1.1rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow{font-size:.75rem;color:var(--muted);text-align:center;padding-bottom:2px}
.day{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0;font:inherit;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.day img{width:100%;height:100%;object-fit:cover;display:block}
.day .ph{font-size:.55rem;padding:3px}
.day.blank{visibility:hidden}
.day.nodata{font-size:.75rem;cursor:default}
.day.today{outline:2.5px solid var(--accent);outline-offset:1px}
.day.sel{outline:2.5px solid var(--ink);outline-offset:1px}

.list{margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.thumb{width:48px;height:48px;border-radius:8px;overflow:hidden;flex:none;background:var(--bg)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{font-size:.5rem}
.rank{width:1.6em;color:var(--muted);font-weight:600;text-align:right;flex:none}
.grow{flex:1;min-width:0}
.dates{color:var(--muted);font-size:.85rem}
.len{font-weight:800;font-size:1.25rem;white-space:nowrap}
.len small{font-size:.8rem;font-weight:400;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.empty{color:var(--muted);padding:18px 4px}
footer{margin-top:40px;color:var(--muted);font-size:.85rem}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.grid{gap:3px}.day{border-radius:6px}}
</style>
</head>
<body>
<div id="root"><p class="sub">Loading…</p></div>
<script>
(function(){
var DAY=86400000;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var MONTHS_L=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CHARTS=[['switch2','Switch 2'],['switch1','Switch 1']];
var history=null, chart='switch2', span=60, calY, calM, selDate=null, entries=[], images={};

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toNum(d){var p=d.split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/DAY);}
function toStr(n){return new Date(n*DAY).toISOString().slice(0,10);}
function todayStr(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function nice(n){var d=new Date(n*DAY);return MONTHS[d.getUTCMonth()]+' '+d.getUTCDate();}
function hue(name){var h=0,s=name.toLowerCase();for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return (h*137)%360;}
function col(name){return 'hsl('+hue(name)+' 55% var(--bar-l))';}
function stripRank(t,rank){var m=String(t||'').match(/^#?(\d{1,3})[.):]?\s+(.+)$/);return m&&Number(m[1])===rank?m[2]:String(t||'');}
function chartLabel(){return (CHARTS.filter(function(c){return c[0]===chart;})[0]||['',''])[1];}

function art(game,eager){
  var src=images[game];
  if(src)return '<img src="'+esc(src)+'" alt="'+esc(game)+'"'+(eager?' fetchpriority="high"':' loading="lazy"')+' decoding="async">';
  return '<div class="ph" style="background:'+col(game)+'" role="img" aria-label="'+esc(game)+'">'+esc(game)+'</div>';
}

function indexImages(){
  images={};var days=history.days||{};
  Object.keys(history.images||{}).forEach(function(t){images[t]=history.images[t];});
  Object.keys(days).forEach(function(d){var ch=days[d].charts||{};Object.keys(ch).forEach(function(k){(ch[k]||[]).forEach(function(g){var t=stripRank(g.title,g.rank);if(g.image&&!/^https?:/.test(g.image)&&!images[t])images[t]=g.image;});});});
}
function build(){
  var days=history.days||{};
  entries=Object.keys(days).sort().filter(function(d){return days[d].no1&&days[d].no1[chart];}).map(function(d){return {date:d,game:stripRank(days[d].no1[chart],1)};});
}
function byDate(){var m={};entries.forEach(function(e){m[e.date]=e.game;});return m;}
function streaks(){
  var out=[],cur=null;
  entries.forEach(function(e){var n=toNum(e.date);
    if(cur&&cur.game===e.game&&n===cur.end+1)cur.end=n;else{cur={game:e.game,start:n,end:n};out.push(cur);}});
  out.forEach(function(s){s.len=s.end-s.start+1;});
  return out;
}

function topBar(){
  var days=history.days||{}, avail=CHARTS.filter(function(c){return Object.keys(days).some(function(d){return days[d].no1&&days[d].no1[c[0]];});});
  var seg=avail.length>1?'<div class="seg" role="group" aria-label="Which chart">'+avail.map(function(c){return '<button type="button" data-chart="'+c[0]+'" aria-pressed="'+(chart===c[0])+'">'+c[1]+'</button>';}).join('')+'</div>':'';
  return '<div class="top-bar"><h1>eShop top game · Australia</h1>'+seg+'</div>';
}

function hero(st){
  if(!entries.length)return '<div class="hero"><div class="hero-game">Waiting for the first daily check</div><p class="hero-meta">The first entry appears after the scheduled job runs.</p></div>';
  var t=toNum(todayStr()), last=st[st.length-1], isToday=last.end===t;
  var label=isToday?'Today\'s top '+chartLabel()+' game':'Top '+chartLabel()+' game on '+nice(last.end);
  var pips='';for(var i=0;i<Math.min(last.len,60);i++)pips+='<span class="pip" style="background:'+col(last.game)+'"></span>';
  return '<div class="hero"><p class="hero-label">'+esc(label)+'</p><div class="hero-art">'+art(last.game,true)+'</div>'+
    '<div class="hero-game">'+esc(last.game)+'</div>'+
    '<p class="hero-meta">'+(last.len===1?'First day on top':last.len+' days in a row, since '+nice(last.start))+'</p>'+(last.len>1?'<div class="pips" aria-hidden="true">'+pips+'</div>':'')+'</div>';
}

function gantt(st){
  if(entries.length<2)return '';
  var lastN=Math.max(toNum(entries[entries.length-1].date),toNum(todayStr()));
  var firstN=toNum(entries[0].date);
  var from=span==='all'?firstN:Math.max(firstN,lastN-span+1);
  var days=lastN-from+1, dw=days>120?6:days>60?10:16, pad=8, top=26, rowH=42;
  var vis=st.filter(function(s){return s.end>=from;});
  var rows=[];vis.forEach(function(s){if(rows.indexOf(s.game)<0)rows.push(s.game);});
  var W=pad*2+days*dw+160, H=top+rows.length*rowH+8, svg='';
  for(var n=from;n<=lastN;n++){var d=new Date(n*DAY);if(d.getUTCDate()===1||n===from){var x=pad+(n-from)*dw;
    svg+='<line x1="'+x+'" y1="18" x2="'+x+'" y2="'+H+'" stroke="var(--line)"/><text x="'+(x+3)+'" y="13" font-size="11" fill="var(--muted)">'+MONTHS[d.getUTCMonth()]+(d.getUTCMonth()===0||n===from?' '+d.getUTCFullYear():'')+'</text>';}}
  rows.forEach(function(g,i){
    var y=top+i*rowH, mine=vis.filter(function(s){return s.game===g;}), fx=pad+(Math.max(mine[0].start,from)-from)*dw;
    svg+='<text x="'+fx+'" y="'+(y+12)+'" font-size="12" font-weight="600" fill="var(--ink)">'+esc(g)+'</text>';
    mine.forEach(function(s){var a=Math.max(s.start,from),x=pad+(a-from)*dw,w=(s.end-a+1)*dw-2;
      svg+='<rect x="'+x+'" y="'+(y+17)+'" width="'+Math.max(w,3)+'" height="18" rx="4" fill="'+col(g)+'"><title>'+esc(g)+': '+s.len+' day'+(s.len>1?'s':'')+', '+nice(s.start)+(s.len>1?' to '+nice(s.end):'')+'</title></rect>';
      if(s.len>1&&w>=22)svg+='<text x="'+(x+5)+'" y="'+(y+30)+'" font-size="11" font-weight="800" fill="#fff">'+s.len+'</text>';});
  });
  var t=toNum(todayStr());if(t>=from){var tx=pad+(t-from)*dw+dw/2;svg+='<line x1="'+tx+'" y1="18" x2="'+tx+'" y2="'+H+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="3 3"/>';}
  function b(v,l){return '<button type="button" data-span="'+v+'" aria-pressed="'+(span===v)+'">'+l+'</button>';}
  return '<section><h2>Timeline</h2><p class="sub">Each bar is a run at the top. Numbers are days held.</p><div class="seg spaced">'+b(30,'30 days')+b(60,'60 days')+b(180,'6 months')+b('all','All')+'</div>'+
    '<div class="panel scroll" id="gscroll"><svg width="'+W+'" height="'+H+'" role="img" aria-label="Timeline of top games">'+svg+'</svg></div></section>';
}

function calendar(){
  var map=byDate(), first=new Date(Date.UTC(calY,calM,1)), startDow=first.getUTCDay(), dim=new Date(Date.UTC(calY,calM+1,0)).getUTCDate(), t=todayStr();
  var h='<div class="grid">';['S','M','T','W','T','F','S'].forEach(function(d){h+='<div class="dow">'+d+'</div>';});
  for(var i=0;i<startDow;i++)h+='<div class="day blank"></div>';
  for(var d=1;d<=dim;d++){var ds=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),g=map[ds];
    var cls='day'+(g?'':' nodata')+(ds===t?' today':'')+(ds===selDate?' sel':'');
    h+=g?'<button type="button" class="'+cls+'" data-day="'+ds+'" aria-label="'+nice(toNum(ds))+': '+esc(g)+'" title="'+nice(toNum(ds))+': '+esc(g)+'">'+art(g)+'</button>'
        :'<div class="'+cls+'" aria-hidden="true">'+d+'</div>';}
  h+='</div>';
  return '<section><h2>Calendar</h2><p class="sub">Tap a day to see its top 10.</p><div class="panel"><div class="cal-head"><button type="button" class="icon-btn" data-cal="-1" aria-label="Previous month">‹</button><strong>'+MONTHS_L[calM]+' '+calY+'</strong><button type="button" class="icon-btn" data-cal="1" aria-label="Next month">›</button></div>'+h+'</div>'+detail()+'</section>';
}

function detail(){
  if(!selDate)return '';
  var rec=(history.days||{})[selDate], list=rec&&rec.charts&&rec.charts[chart];
  var body=list&&list.length
    ?'<ul class="list">'+list.map(function(g){var t=stripRank(g.title,g.rank);return '<li><span class="rank">'+g.rank+'</span><span class="thumb">'+art(t)+'</span><span class="grow">'+esc(t)+'</span></li>';}).join('')+'</ul>'
    :'<p class="empty">No chart was recorded this day.</p>';
  return '<div class="panel" style="margin-top:12px" id="detail"><strong>'+esc(chartLabel())+' top 10, '+nice(toNum(selDate))+'</strong>'+body+'</div>';
}

function board(st){
  if(!entries.length)return '';
  var topS=st.slice().sort(function(a,b){return b.len-a.len||b.end-a.end;}).slice(0,10), last=st[st.length-1], t=toNum(todayStr());
  var rows=topS.map(function(s){var live=s===last&&s.end>=t-1;
    return '<li><span class="thumb">'+art(s.game)+'</span><span class="grow">'+esc(s.game)+(live?'<span class="tag">Active</span>':'')+'<div class="dates">'+nice(s.start)+(s.len>1?' to '+nice(s.end):'')+', '+new Date(s.end*DAY).getUTCFullYear()+'</div></span><span class="len">'+s.len+'<small> d</small></span></li>';}).join('');
  return '<section><h2>Longest streaks</h2><p class="sub">Consecutive days at the top. A day with no recording ends a streak.</p><div class="panel"><ul class="list">'+rows+'</ul></div></section>';
}

function render(){
  build();
  var st=streaks(), sx=document.getElementById('gscroll'), keepRight=!sx||sx.scrollLeft+sx.clientWidth>=sx.scrollWidth-4, oldLeft=sx?sx.scrollLeft:0;
  var updated=history.updatedAt?new Date(history.updatedAt).toLocaleString([], {timeZone:'America/Los_Angeles',dateStyle:'medium',timeStyle:'short'})+' Pacific':'not yet';
  document.getElementById('root').innerHTML=topBar()+hero(st)+calendar()+gantt(st)+board(st)+
    '<footer>Checked once a day from the Nintendo Australia store\'s digital-download charts. Last updated '+esc(updated)+'. Not affiliated with Nintendo.</footer>';
  var ns=document.getElementById('gscroll');if(ns)ns.scrollLeft=keepRight?ns.scrollWidth:oldLeft;
}

document.getElementById('root').addEventListener('click',function(e){
  var el=e.target.closest('[data-span],[data-cal],[data-day],[data-chart]');if(!el)return;
  if(el.dataset.chart){chart=el.dataset.chart;render();}
  else if(el.dataset.span){span=el.dataset.span==='all'?'all':Number(el.dataset.span);render();}
  else if(el.dataset.cal){calM+=Number(el.dataset.cal);if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}render();}
  else if(el.dataset.day){selDate=selDate===el.dataset.day?null:el.dataset.day;render();var dt=document.getElementById('detail');if(dt)dt.scrollIntoView({behavior:'smooth',block:'nearest'});}
});

fetch('data/history.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(h){
  history=h;indexImages();
  var avail=CHARTS.filter(function(c){return Object.keys(h.days||{}).some(function(d){return h.days[d].no1&&h.days[d].no1[c[0]];});});if(avail.length)chart=avail[0][0];
  var keys=Object.keys(h.days||{}).sort(), anchor=keys.length?keys[keys.length-1]:todayStr();
  var p=anchor.split('-').map(Number);calY=p[0];calM=p[1]-1;render();
}).catch(function(err){
  document.getElementById('root').innerHTML='<h1>eShop top game · Australia</h1><p class="empty">Couldn\'t load the data ('+esc(err.message)+').</p>';
});
})();
</script>
</body>
</html>
